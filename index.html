<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECH RWT BLOGS - Modern Knowledge & Tech Portal</title>
  <meta name="description" content="Explore insightful articles on AI, Education, Government Services, Technology, and Digital Guides at TECH RWT BLOGS.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/images/logo-banner.webp" type="image/webp">
</head>
<body>

  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="container hero-container">
      <div class="hero-content">
        <span class="hero-badge">Welcome to TECH RWT BLOGS</span>
        <h1>Empowering Your Mind with <span class="highlight">Smart Knowledge</span></h1>
        <p>Your ultimate destination for cutting-edge AI trends, essential education guides, government services updates, and modern tech tips.</p>
        <div class="hero-search-bar">
          <form action="/search.html" method="GET">
            <input type="text" name="q" placeholder="Search articles (e.g. AI, PAN Card, Maths)..." required>
            <button type="submit" class="btn btn-primary">Search</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content Area -->
  <main class="main-content container">
    <!-- Featured Articles Section -->
    <section class="section-block">
      <div class="section-header">
        <h2>Featured Articles</h2>
        <span class="section-line"></span>
      </div>
      <div class="articles-grid" id="featuredArticlesGrid">
        <!-- Dynamically rendered via app.js -->
      </div>
    </section>

    <!-- Latest Articles Section -->
    <section class="section-block">
      <div class="section-header">
        <h2>Latest Insights</h2>
        <span class="section-line"></span>
      </div>
      <div class="articles-grid" id="latestArticlesGrid">
        <!-- Dynamically rendered via app.js -->
      </div>
    </section>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
